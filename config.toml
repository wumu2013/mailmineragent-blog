baseURL = "https://mailmineragent.com"
languageCode = "en-us"
title = "MailMiner Agent Blog"
theme = "PaperMod"
buildFuture = true

[pagination]
  pagerSize = 10
enableRobotsTXT = true

[[menu.main]]
identifier = "mailminer"
name = "MailMiner"
url = "https://mailminer.work"
weight = 10

[[menu.main]]
identifier = "about"
name = "About"
url = "/about/"
weight = 15

[[menu.main]]
identifier = "posts"
name = "Posts"
url = "/posts/"
weight = 20

[[menu.main]]
  identifier = "search"
  name = "Search"
  url = "/search/"
  weight = 30

[[menu.main]]
  identifier = "tags"
  name = "Tags"
  url = "/tags/"
  weight = 40

[params]
  description = "Technical blog about MailMiner Agent — AI-powered email mining, intelligent automation, and data extraction."
  author = { name = "MailMiner Editorial Team", url = "/about/" }
  defaultTheme = "auto"
  ShowShareButtons = true
  ShowReadingTime = true
  ShowToc = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowPostNavLinks = true
  ShowFullTextinRSS = true

  [params.homeInfoParams]
    Title = "Welcome to MailMiner Agent Blog"
    Content = "AI systems engineering & real-world cross-border entrepreneurship case studies.\nTechnical deep dives and actionable business playbooks."

  [params.schema]
    publisherType = "Organization"
    sameAs = [
      "https://github.com/wumu2013/mailmineragent-blog",
      "https://mailminer.work"
    ]

  [[params.socialIcons]]
    name = "github"
    url = "https://github.com/wumu2013/mailmineragent-blog"

  [[params.socialIcons]]
    name = "mailminer"
    url = "https://mailminer.work"

[outputs]
  home = ["HTML", "RSS", "JSON", "LLMs"]

[mediaTypes]
  [mediaTypes."text/plain"]
    suffixes = ["txt"]

[outputFormats.LLMs]
  mediaType = "text/plain"
  baseName = "llms"
  isPlainText = true
  notAlternative = true

[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
  [markup.highlight]
    noClasses = false
